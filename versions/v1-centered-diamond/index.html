<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CKC Jewellers · AI Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080808;
      --gold: #d9b673;
      --gold-soft: rgba(217, 182, 115, 0.75);
      --line: rgba(217, 182, 115, 0.22);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: #f3ede0;
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Soft vignette so the matte black reads as depth, not flatness */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(8,8,8,0) 38%, rgba(4,4,4,0.55) 78%, rgba(2,2,2,0.92) 100%);
    }

    /* ---------- Branding ---------- */
    #brand {
      position: fixed;
      top: 42px;
      left: 0;
      right: 0;
      z-index: 3;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 2.4s ease 0.4s forwards;
    }
    #brand .mark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      letter-spacing: 0.42em;
      font-size: 30px;
      color: #f6efe0;
      text-indent: 0.42em;
    }
    #brand .sub {
      margin-top: 12px;
      font-weight: 300;
      letter-spacing: 0.58em;
      font-size: 10.5px;
      text-indent: 0.58em;
      color: var(--gold-soft);
      text-transform: uppercase;
    }
    #brand .rule {
      width: 46px;
      height: 1px;
      margin: 18px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.7;
    }

    /* ---------- Status caption ---------- */
    #status {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 168px;
      z-index: 3;
      text-align: center;
      pointer-events: none;
      font-weight: 300;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      font-size: 11px;
      text-transform: uppercase;
      color: rgba(243, 237, 224, 0.5);
      transition: opacity 1.2s ease, color 1.2s ease;
    }

    /* ---------- Controls ---------- */
    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 64px;
      z-index: 4;
      display: flex;
      justify-content: center;
      gap: 18px;
      opacity: 0;
      animation: fadeIn 2.2s ease 1s forwards;
    }

    .lang-btn {
      position: relative;
      min-width: 132px;
      padding: 15px 26px 14px;
      background: rgba(255, 255, 255, 0.012);
      border: 1px solid var(--line);
      border-radius: 2px;
      color: #ece3d0;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 0.16em;
      cursor: pointer;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      transition: border-color 0.55s ease, color 0.55s ease, background 0.55s ease, transform 0.4s ease, box-shadow 0.6s ease;
      overflow: hidden;
    }
    .lang-btn .label { position: relative; z-index: 2; display: block; }
    .lang-btn .native {
      display: block;
      font-size: 10px;
      letter-spacing: 0.22em;
      margin-top: 4px;
      color: var(--gold-soft);
      opacity: 0.85;
    }
    .lang-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 90% at 50% 120%, rgba(217,182,115,0.16), transparent 70%);
      opacity: 0;
      transition: opacity 0.55s ease;
      z-index: 1;
    }
    .lang-btn:hover {
      border-color: rgba(217, 182, 115, 0.6);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 14px 40px -22px rgba(217,182,115,0.6);
    }
    .lang-btn:hover::after { opacity: 1; }
    .lang-btn.active {
      border-color: var(--gold);
      color: #fff;
      background: rgba(217, 182, 115, 0.06);
      box-shadow: 0 0 0 1px rgba(217,182,115,0.25), 0 18px 50px -24px rgba(217,182,115,0.7);
    }
    .lang-btn.active::after { opacity: 1; }

    @keyframes fadeIn { to { opacity: 1; } }

    /* ---------- Loading veil ---------- */
    #veil {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1.4s ease;
    }
    #veil.hidden { opacity: 0; pointer-events: none; }
    #veil .ring {
      width: 38px; height: 38px;
      border: 1px solid rgba(217,182,115,0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 560px) {
      #brand .mark { font-size: 23px; letter-spacing: 0.32em; }
      #controls { gap: 10px; bottom: 42px; }
      .lang-btn { min-width: 0; flex: 1; max-width: 116px; padding: 13px 8px; }
      #status { bottom: 134px; }
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="vignette"></div>

  <header id="brand">
    <div class="mark">CKC&nbsp;JEWELLERS</div>
    <div class="sub">AI Concierge</div>
    <div class="rule"></div>
  </header>

  <div id="status">Tap a language to begin</div>

  <nav id="controls">
    <button class="lang-btn" data-audio="assets/audio/english.mp3" data-name="English">
      <span class="label">English</span>
      <span class="native">EN</span>
    </button>
    <button class="lang-btn" data-audio="assets/audio/hindi.mp3" data-name="हिन्दी">
      <span class="label">हिन्दी</span>
      <span class="native">Hindi</span>
    </button>
    <button class="lang-btn" data-audio="assets/audio/kannada.mp3" data-name="ಕನ್ನಡ">
      <span class="label">ಕನ್ನಡ</span>
      <span class="native">Kannada</span>
    </button>
  </nav>

  <div id="veil"><div class="ring"></div></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
